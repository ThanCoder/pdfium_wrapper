name: Build PDFium Wrapper - iOS Device ARM64

on:
  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version }}

jobs:
  build-ios-arm64:
    name: iOS Device ARM64

    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux

          brew install \
            cmake \
            ninja

      - name: Download PDFium
        run: |
          set -eux

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/pdfium-ios-device-arm64.tgz" \
            -o pdfium.tgz

      - name: Extract PDFium
        run: |
          set -eux

          mkdir -p pdfium

          tar \
            -xzf pdfium.tgz \
            -C pdfium

          rm -f pdfium.tgz

          find pdfium -maxdepth 2 -type f -print

      - name: Verify PDFium
        run: |
          set -eux

          test -f pdfium/lib/libpdfium.a

          file pdfium/lib/libpdfium.a

      - name: Configure CMake
        run: |
          set -eux

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPDFIUM_ROOT="$PWD/pdfium"

      - name: Build
        run: |
          set -eux

          cmake \
            --build build \
            --parallel

      - name: Verify Wrapper
        run: |
          set -eux

          test -f build/libpdfium_wrapper.dylib

          file build/libpdfium_wrapper.dylib

      - name: Prepare artifact
        run: |
          set -eux

          mkdir -p dist

          cp \
            build/libpdfium_wrapper.dylib \
            dist/

          echo "Artifact:"
          find dist -type f -print

      - name: Upload iOS ARM64
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-ios-device-arm64
          path: dist/
          if-no-files-found: error

