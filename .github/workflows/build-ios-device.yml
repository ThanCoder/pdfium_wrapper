name: Build PDFium Wrapper - iOS Device ARM64

on:
  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version }}

jobs:
  build-ios-arm64:
    name: iOS Device ARM64

    runs-on: macos-14

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # Dependencies
      # ========================================================

      - name: Install dependencies
        run: |
          set -eux

          brew install \
            cmake \
            ninja


      # ========================================================
      # Download PDFium
      # ========================================================

      - name: Download PDFium
        run: |
          set -eux

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/pdfium-ios-device-arm64.tgz" \
            -o pdfium.tgz

          test -f pdfium.tgz


      # ========================================================
      # Extract PDFium
      # ========================================================

      - name: Extract PDFium
        run: |
          set -eux

          mkdir -p pdfium

          tar \
            -xzf pdfium.tgz \
            -C pdfium

          rm -f pdfium.tgz

          echo
          echo "=== PDFium files ==="

          find pdfium \
            -type f \
            -print \
            | sort


      # ========================================================
      # Locate PDFium
      # ========================================================

      - name: Locate PDFium
        run: |
          set -eux

          PDFIUM_LIB="$(
            find "$PWD/pdfium" \
              -type f \
              -name "libpdfium.a" \
              -print \
              -quit
          )"

          test -n "$PDFIUM_LIB"
          test -f "$PDFIUM_LIB"

          echo "PDFIUM_LIBRARY=$PDFIUM_LIB" >> "$GITHUB_ENV"

          echo
          echo "PDFium library:"
          echo "$PDFIUM_LIB"


      # ========================================================
      # Verify PDFium
      # ========================================================

      - name: Verify PDFium
        run: |
          set -eux

          test -f "$PDFIUM_LIBRARY"

          file \
            "$PDFIUM_LIBRARY"

          echo
          echo "PDFium architecture:"

          lipo -info \
            "$PDFIUM_LIBRARY"


      # ========================================================
      # Configure CMake
      # ========================================================

      - name: Configure CMake
        run: |
          set -eux

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPDFIUM_ROOT="$PWD/pdfium" \
            -DPDFIUM_LIBRARY="$PDFIUM_LIBRARY"


      # ========================================================
      # Build
      # ========================================================

      - name: Build
        run: |
          set -eux

          cmake \
            --build build \
            --parallel


      # ========================================================
      # Verify Wrapper
      # ========================================================

      - name: Verify Wrapper
        run: |
          set -eux

          test -f \
            build/libpdfium_wrapper.dylib

          echo
          echo "Wrapper:"

          file \
            build/libpdfium_wrapper.dylib

          echo
          echo "Wrapper architecture:"

          lipo -info \
            build/libpdfium_wrapper.dylib


      # ========================================================
      # Prepare artifact
      #
      # Only wrapper is uploaded.
      # libpdfium.a is intentionally NOT uploaded.
      # ========================================================

      - name: Prepare artifact
        run: |
          set -eux

          mkdir -p dist/lib

          cp \
            build/libpdfium_wrapper.dylib \
            dist/lib/

          # PDFium static library intentionally NOT uploaded.
          #
          # cp \
          #   "$PDFIUM_LIBRARY" \
          #   dist/lib/

          echo
          echo "Artifact:"

          find dist \
            -type f \
            -print \
            | sort


      # ========================================================
      # Verify artifact
      # ========================================================

      - name: Verify artifact
        run: |
          set -eux

          test -f \
            dist/lib/libpdfium_wrapper.dylib

          echo
          echo "Artifact files:"

          find dist \
            -type f \
            -print \
            | sort

          echo
          echo "Wrapper:"

          file \
            dist/lib/libpdfium_wrapper.dylib

          echo
          echo "Architecture:"

          lipo -info \
            dist/lib/libpdfium_wrapper.dylib


      # ========================================================
      # Upload
      # ========================================================

      - name: Upload iOS ARM64
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-ios-device-arm64
          path: dist/
          if-no-files-found: error