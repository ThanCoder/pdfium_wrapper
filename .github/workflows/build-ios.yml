name: Build iOS

on:
  workflow_dispatch:
  workflow_call:

env:
  PDFIUM_VERSION: "7988"

jobs:

  build:

    name: iOS device arm64

    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFium
        run: |

          mkdir -p third_party/pdfium

          curl -L \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/pdfium-ios-device-arm64.tgz" \
            -o pdfium.tgz

          tar -xzf pdfium.tgz \
            -C third_party/pdfium

      - name: Inspect PDFium
        run: |

          find third_party/pdfium \
            -maxdepth 4 \
            -type f \
            | sort

      - name: Configure
        run: |

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPDFIUM_DIR="$PWD/third_party/pdfium"

      - name: Build
        run: |

          cmake \
            --build build \
            --config Release \
            --parallel

      - name: Verify
        run: |

          test -f build/libpdfium_wrapper.a

          file \
            build/libpdfium_wrapper.a

      - name: Package
        run: |

          mkdir -p dist/ios-arm64

          cp \
            build/libpdfium_wrapper.a \
            dist/ios-arm64/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-ios-arm64
          path: dist/ios-arm64/libpdfium_wrapper.a