name: Build PDFium Wrapper - iOS

on:

  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version || '7988' }}

jobs:

  ios-device-arm64:

    name: iOS device arm64

    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Show Xcode
        run: |
          xcodebuild -version

          xcrun --sdk iphoneos --show-sdk-path

      - name: Download PDFium
        env:
          PDFIUM_PACKAGE: pdfium-ios-device-arm64
        run: |
          chmod +x .github/scripts/download-pdfium.sh
          .github/scripts/download-pdfium.sh

      - name: Find PDFium
        shell: bash
        run: |
          echo "PDFium files:"
          find .pdfium -type f -print

          PDFIUM_LIBRARY="$(find .pdfium -type f \
            \( \
              -name 'libpdfium.dylib' \
              -o \
              -name 'pdfium.dylib' \
              -o \
              -name 'libpdfium.a' \
            \) \
            | head -n 1)"

          if [ -z "$PDFIUM_LIBRARY" ]; then
            echo "PDFium library not found"
            exit 1
          fi

          echo "PDFIUM_LIBRARY=$PDFIUM_LIBRARY" >> "$GITHUB_ENV"

          PDFIUM_ROOT="$(dirname "$(dirname "$PDFIUM_LIBRARY")")"

          echo "PDFIUM_ROOT=$PDFIUM_ROOT" >> "$GITHUB_ENV"

          echo "PDFIUM_ROOT=$PDFIUM_ROOT"
          echo "PDFIUM_LIBRARY=$PDFIUM_LIBRARY"

      - name: Configure
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DPDFIUM_ROOT="$PDFIUM_ROOT"

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      - name: Verify
        run: |
          find build -type f -maxdepth 3 -print

          file \
            build/libpdfium_wrapper.dylib \
            || true

      - name: Package
        run: |
          mkdir -p dist/ios-device-arm64

          if [ -f "build/libpdfium_wrapper.dylib" ]; then
            cp \
              build/libpdfium_wrapper.dylib \
              dist/ios-device-arm64/
          fi

          if [ -f "build/libpdfium_wrapper.a" ]; then
            cp \
              build/libpdfium_wrapper.a \
              dist/ios-device-arm64/
          fi

          cp src/ffi/ffi_wrapper.h \
            dist/ios-device-arm64/

          cp "$PDFIUM_LIBRARY" \
            dist/ios-device-arm64/

          tar \
            -czf \
            pdfium-wrapper-ios-device-arm64.tar.gz \
            -C dist \
            ios-device-arm64

      - name: Upload
        uses: actions/upload-artifact@v4

        with:
          name: pdfium-wrapper-ios-device-arm64
          path: pdfium-wrapper-ios-device-arm64.tar.gz
          if-no-files-found: error