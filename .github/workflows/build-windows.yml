name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

env:
  PDFIUM_VERSION: "7988"

jobs:

  build:

    name: Windows x64
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFium
        shell: pwsh
        run: |

          New-Item \
            -ItemType Directory \
            -Force \
            -Path third_party/pdfium

          $url = `
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${env:PDFIUM_VERSION}/pdfium-win-x64.tgz"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile pdfium.tgz

          tar -xzf pdfium.tgz `
            -C third_party/pdfium

      - name: Inspect PDFium
        shell: pwsh
        run: |

          Get-ChildItem \
            third_party/pdfium \
            -Recurse

      - name: Configure
        run: |

          cmake `
            -S . `
            -B build `
            -DPDFIUM_DIR="$PWD/third_party/pdfium"

      - name: Build
        run: |

          cmake `
            --build build `
            --config Release `
            --parallel

      - name: Verify
        shell: pwsh
        run: |

          Test-Path build/Release/pdfium_wrapper.dll

      - name: Package
        shell: pwsh
        run: |

          New-Item \
            -ItemType Directory \
            -Force \
            -Path dist/windows-x64

          Copy-Item \
            build/Release/pdfium_wrapper.dll \
            dist/windows-x64/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-windows-x64
          path: dist/windows-x64/pdfium_wrapper.dll