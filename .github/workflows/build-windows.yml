name: Build PDFium Wrapper - Windows

on:

  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version || '7988' }}

jobs:

  windows-x64:

    name: Windows x64

    runs-on: windows-2025

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Download PDFium
        shell: pwsh
        run: |
          $version = "${{ env.PDFIUM_VERSION }}"
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F$version/pdfium-win-x64.tgz"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile pdfium.tgz

          Remove-Item -Recurse -Force .pdfium -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            .pdfium | Out-Null

          tar `
            -xzf pdfium.tgz `
            -C .pdfium

          Get-ChildItem `
            -Recurse `
            .pdfium

      - name: Find PDFium
        shell: pwsh
        run: |
          $dll = Get-ChildItem `
            -Recurse `
            .pdfium `
            -Filter pdfium.dll |
            Select-Object -First 1

          if (-not $dll) {
            throw "pdfium.dll not found"
          }

          $root = $dll.Directory.Parent.FullName

          "PDFIUM_ROOT=$root" >> $env:GITHUB_ENV

          Write-Host "PDFIUM_ROOT=$root"

      - name: Configure
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DPDFIUM_ROOT=$env:PDFIUM_ROOT"

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel

      - name: Verify
        shell: pwsh
        run: |
          Get-ChildItem `
            -Recurse `
            build `
            -Filter "*.dll"

      - name: Package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            dist\windows-x64 | Out-Null

          $wrapper = Get-ChildItem `
            -Recurse `
            build `
            -Filter pdfium_wrapper.dll |
            Select-Object -First 1

          if (-not $wrapper) {
            throw "pdfium_wrapper.dll not found"
          }

          Copy-Item `
            $wrapper.FullName `
            dist\windows-x64\pdfium_wrapper.dll

          Copy-Item `
            $env:PDFIUM_ROOT\bin\pdfium.dll `
            dist\windows-x64\pdfium.dll

          Copy-Item `
            src\ffi\ffi_wrapper.h `
            dist\windows-x64\ffi_wrapper.h

          tar `
            -czf `
            pdfium-wrapper-windows-x64.tar.gz `
            -C dist `
            windows-x64

      - name: Upload
        uses: actions/upload-artifact@v4

        with:
          name: pdfium-wrapper-windows-x64
          path: pdfium-wrapper-windows-x64.tar.gz
          if-no-files-found: error