name: Build PDFium Wrapper - Windows x64

on:
  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version }}

jobs:
  build-windows-x64:
    name: Windows x64

    runs-on: windows-2025

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # Dependencies
      # ========================================================

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install cmake ninja -y


      # ========================================================
      # Download PDFium
      # ========================================================

      - name: Download PDFium
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${env:PDFIUM_VERSION}/pdfium-win-x64.tgz"

          curl.exe `
            --fail `
            --location `
            --retry 3 `
            --retry-delay 2 `
            $url `
            -o pdfium.tgz

          if (!(Test-Path "pdfium.tgz")) {
            throw "pdfium.tgz was not downloaded"
          }


      # ========================================================
      # Extract PDFium
      # ========================================================

      - name: Extract PDFium
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            pdfium | Out-Null

          tar.exe `
            -xzf pdfium.tgz `
            -C pdfium

          Remove-Item `
            -Force `
            pdfium.tgz

          Write-Host ""
          Write-Host "=== PDFium files ==="

          Get-ChildItem `
            pdfium `
            -Recurse `
            -File |
            Select-Object FullName


      # ========================================================
      # Locate PDFium DLL
      # ========================================================

      - name: Locate PDFium
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pdfium = Get-ChildItem `
            -Path "$PWD/pdfium" `
            -Recurse `
            -File `
            -Filter "pdfium.dll" |
            Select-Object -First 1

          if ($null -eq $pdfium) {
            throw "pdfium.dll not found under $PWD/pdfium"
          }

          $pdfiumPath = $pdfium.FullName

          Write-Host ""
          Write-Host "PDFium DLL:"
          Write-Host $pdfiumPath

          "PDFIUM_LIBRARY=$pdfiumPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "PDFIUM_LIBRARY=$pdfiumPath" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 `
              -Append


      # ========================================================
      # Verify PDFium
      # ========================================================

      - name: Verify PDFium
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "$env:PDFIUM_LIBRARY")) {
            throw "PDFium library not found: $env:PDFIUM_LIBRARY"
          }

          Get-Item "$env:PDFIUM_LIBRARY"


      # ========================================================
      # Configure CMake
      # ========================================================

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DPDFIUM_ROOT=$PWD/pdfium" `
            "-DPDFIUM_LIBRARY=$env:PDFIUM_LIBRARY"


      # ========================================================
      # Build
      # ========================================================

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build `
            --parallel


      # ========================================================
      # Verify Wrapper
      # ========================================================

      - name: Verify Wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wrapper = "build/pdfium_wrapper.dll"

          if (!(Test-Path $wrapper)) {
            throw "pdfium_wrapper.dll not found"
          }

          Write-Host ""
          Write-Host "Wrapper:"
          Get-Item $wrapper

          Write-Host ""
          Write-Host "Exports:"

          dumpbin /exports $wrapper |
            Select-String "pdfium_init"


      # ========================================================
      # Prepare artifact
      #
      # Only wrapper is uploaded.
      # PDFium DLL is intentionally NOT uploaded.
      # ========================================================

      - name: Prepare artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            dist/lib | Out-Null

          Copy-Item `
            build/pdfium_wrapper.dll `
            dist/lib/

          # PDFium DLL intentionally NOT uploaded.
          #
          # Copy-Item `
          #   $env:PDFIUM_LIBRARY `
          #   dist/lib/

          Write-Host ""
          Write-Host "Artifact:"

          Get-ChildItem `
            dist `
            -Recurse `
            -File


      # ========================================================
      # Verify artifact
      # ========================================================

      - name: Verify artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wrapper = "dist/lib/pdfium_wrapper.dll"

          if (!(Test-Path $wrapper)) {
            throw "Wrapper artifact not found"
          }

          Write-Host ""
          Write-Host "Artifact files:"

          Get-ChildItem `
            dist `
            -Recurse `
            -File

          Write-Host ""
          Write-Host "Wrapper:"

          Get-Item $wrapper


      # ========================================================
      # Upload
      # ========================================================

      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-windows-x64
          path: dist/
          if-no-files-found: error