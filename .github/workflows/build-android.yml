name: Build Android

on:
  workflow_dispatch:
  workflow_call:

env:
  PDFIUM_VERSION: "7988"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:

  build:

    name: Android ${{ matrix.abi }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:

        include:

          - abi: arm64-v8a
            pdfium: pdfium-android-arm64.tgz

          - abi: armeabi-v7a
            pdfium: pdfium-android-arm.tgz

          - abi: x86_64
            pdfium: pdfium-android-x64.tgz

          - abi: x86
            pdfium: pdfium-android-x86.tgz

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |

          sdkmanager \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set NDK
        run: |

          echo \
            "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            >> "$GITHUB_ENV"

      - name: Download PDFium
        run: |

          mkdir -p third_party/pdfium

          curl -L \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/${{ matrix.pdfium }}" \
            -o pdfium.tgz

          tar -xzf pdfium.tgz \
            -C third_party/pdfium

      - name: Inspect PDFium
        run: |

          find third_party/pdfium \
            -maxdepth 4 \
            -type f \
            | sort

      - name: Configure
        run: |

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-24 \
            -DPDFIUM_DIR="$PWD/third_party/pdfium"

      - name: Build
        run: |

          cmake \
            --build build \
            --parallel

      - name: Verify
        run: |

          test -f build/libpdfium_wrapper.so

          file \
            build/libpdfium_wrapper.so

      - name: Package
        run: |

          mkdir -p \
            "dist/android/${{ matrix.abi }}"

          cp \
            build/libpdfium_wrapper.so \
            "dist/android/${{ matrix.abi }}/"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-android-${{ matrix.abi }}
          path: dist/android/${{ matrix.abi }}/libpdfium_wrapper.so