name: Build PDFium Wrapper - Android

on:

  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version || '7988' }}

jobs:

  android:

    name: Android

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - abi: armeabi-v7a
            pdfium: pdfium-android-arm

          - abi: arm64-v8a
            pdfium: pdfium-android-arm64

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Set NDK
        run: |
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Download PDFium
        env:
          PDFIUM_PACKAGE: ${{ matrix.pdfium }}
        run: |
          chmod +x .github/scripts/download-pdfium.sh
          .github/scripts/download-pdfium.sh

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-21 \
            -DPDFIUM_ROOT="$GITHUB_WORKSPACE/.pdfium/${{ matrix.pdfium }}"

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      - name: Verify
        run: |
          file build/libpdfium_wrapper.so

      - name: Package
        run: |
          mkdir -p dist/android/${{ matrix.abi }}

          cp build/libpdfium_wrapper.so \
            dist/android/${{ matrix.abi }}/

          cp src/ffi/ffi_wrapper.h \
            dist/android/${{ matrix.abi }}/

          # Copy PDFium binary if it exists as libpdfium.so.
          if [ -f ".pdfium/${{ matrix.pdfium }}/lib/libpdfium.so" ]; then
            cp \
              ".pdfium/${{ matrix.pdfium }}/lib/libpdfium.so" \
              "dist/android/${{ matrix.abi }}/"
          fi

          tar \
            -czf \
            "pdfium-wrapper-android-${{ matrix.abi }}.tar.gz" \
            -C dist \
            android

      - name: Upload
        uses: actions/upload-artifact@v4

        with:
          name: pdfium-wrapper-android-${{ matrix.abi }}
          path: pdfium-wrapper-android-${{ matrix.abi }}.tar.gz
          if-no-files-found: error