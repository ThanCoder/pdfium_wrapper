name: Build Android

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main

env:
  PDFIUM_VERSION: "7988"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:

  build:

    name: Android ${{ matrix.abi }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - abi: arm64-v8a
            pdfium: pdfium-android-arm64.tgz

          - abi: armeabi-v7a
            pdfium: pdfium-android-arm.tgz

          - abi: x86_64
            pdfium: pdfium-android-x64.tgz

          - abi: x86
            pdfium: pdfium-android-x86.tgz

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # Java
      # ========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ========================================================
      # Android SDK
      # ========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========================================================
      # Install NDK
      # ========================================================

      - name: Install NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-24" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ========================================================
      # Find NDK
      # ========================================================

      - name: Set NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # ========================================================
      # Download PDFium
      # ========================================================

      - name: Download PDFium
        run: |
          mkdir -p third_party/pdfium

          curl -L \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/${{ matrix.pdfium }}" \
            -o pdfium.tgz

          tar -xzf pdfium.tgz \
            -C third_party/pdfium

      # ========================================================
      # Inspect
      # ========================================================

      - name: Inspect PDFium
        run: |
          find third_party/pdfium -maxdepth 3 -type f | sort

      # ========================================================
      # Configure
      # ========================================================

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-24 \
            -DPDFIUM_DIR="$PWD/third_party/pdfium"

      # ========================================================
      # Build
      # ========================================================

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      # ========================================================
      # Package
      # ========================================================

      - name: Package
        run: |
          mkdir -p "dist/android/${{ matrix.abi }}"

          cp build/libpdf_engine.so \
            "dist/android/${{ matrix.abi }}/"

          cp third_party/pdfium/lib/libpdfium.so \
            "dist/android/${{ matrix.abi }}/"

      # ========================================================
      # Upload
      # ========================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-engine-android-${{ matrix.abi }}
          path: dist/android/${{ matrix.abi }}/