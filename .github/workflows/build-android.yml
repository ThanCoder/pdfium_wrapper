name: Build PDFium Wrapper - Android

on:
  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version }}

jobs:
  build-android:
    name: Android ${{ matrix.arch }}

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - arch: arm
            pdfium_arch: arm
            abi: armeabi-v7a

          - arch: arm64
            pdfium_arch: arm64
            abi: arm64-v8a

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # Java
      # ========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================================
      # Android SDK
      # ========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ========================================================
      # Dependencies
      # ========================================================

      - name: Install dependencies
        run: |
          set -eux

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

          echo
          echo "Installed NDKs:"

          ls -la \
            "$ANDROID_SDK_ROOT/ndk/"


      # ========================================================
      # Configure NDK
      # ========================================================

      - name: Configure NDK
        run: |
          set -eux

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.0.12077973"

          test -d "$NDK_PATH"

          echo "NDK_PATH=$NDK_PATH" >> "$GITHUB_ENV"

          echo
          echo "NDK:"
          echo "$NDK_PATH"


      # ========================================================
      # Download PDFium
      # ========================================================

      - name: Download PDFium
        run: |
          set -eux

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/pdfium-android-${{ matrix.pdfium_arch }}.tgz" \
            -o pdfium.tgz

          test -f pdfium.tgz


      # ========================================================
      # Extract PDFium
      # ========================================================

      - name: Extract PDFium
        run: |
          set -eux

          mkdir -p pdfium

          tar \
            -xzf pdfium.tgz \
            -C pdfium

          rm -f pdfium.tgz

          echo
          echo "PDFium files:"

          find pdfium \
            -type f \
            -print \
            | sort


      # ========================================================
      # Locate PDFium
      # ========================================================

      - name: Locate PDFium
        run: |
          set -eux

          PDFIUM_LIB="$(
            find "$PWD/pdfium" \
              -type f \
              -name "libpdfium.so" \
              -print \
              -quit
          )"

          test -n "$PDFIUM_LIB"
          test -f "$PDFIUM_LIB"

          echo "PDFIUM_LIBRARY=$PDFIUM_LIB" >> "$GITHUB_ENV"

          echo
          echo "PDFium library:"
          echo "$PDFIUM_LIB"


      # ========================================================
      # Verify PDFium
      # ========================================================

      - name: Verify PDFium
        run: |
          set -eux

          test -f "$PDFIUM_LIBRARY"

          file \
            "$PDFIUM_LIBRARY"

          nm -D \
            "$PDFIUM_LIBRARY" \
            | grep "FPDF_InitLibrary"


      # ========================================================
      # Configure CMake
      # ========================================================

      - name: Configure CMake
        run: |
          set -eux

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-21 \
            -DPDFIUM_ROOT="$PWD/pdfium" \
            -DPDFIUM_LIBRARY="$PDFIUM_LIBRARY"


      # ========================================================
      # Build
      # ========================================================

      - name: Build
        run: |
          set -eux

          cmake \
            --build build \
            --parallel


      # ========================================================
      # Verify Wrapper Before Strip
      # ========================================================

      - name: Verify Wrapper Before Strip
        run: |
          set -eux

          test -f \
            build/libpdfium_wrapper.so

          echo
          echo "Wrapper before strip:"

          file \
            build/libpdfium_wrapper.so


      # ========================================================
      # Strip
      # ========================================================

      - name: Strip Wrapper
        run: |
          set -eux

          LLVM_STRIP="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          test -x "$LLVM_STRIP"

          echo
          echo "LLVM strip:"
          "$LLVM_STRIP" --version

          echo
          echo "Before strip:"

          file \
            build/libpdfium_wrapper.so

          "$LLVM_STRIP" \
            --strip-unneeded \
            build/libpdfium_wrapper.so

          echo
          echo "After strip:"

          file \
            build/libpdfium_wrapper.so


      # ========================================================
      # Verify Wrapper
      # ========================================================

      - name: Verify Wrapper
        run: |
          set -eux

          test -f \
            build/libpdfium_wrapper.so

          echo
          echo "Wrapper:"

          file \
            build/libpdfium_wrapper.so

          echo
          echo "Exported symbols:"

          nm -D \
            build/libpdfium_wrapper.so \
            | grep " pdfium_init$"


      # ========================================================
      # Prepare artifact
      #
      # Only wrapper is uploaded.
      # PDFium library is intentionally NOT uploaded.
      # ========================================================

      - name: Prepare artifact
        run: |
          set -eux

          mkdir -p dist/lib

          cp \
            build/libpdfium_wrapper.so \
            dist/lib/

          # PDFium library intentionally NOT uploaded.
          #
          # cp \
          #   "$PDFIUM_LIBRARY" \
          #   dist/lib/

          echo
          echo "Artifact:"

          find dist \
            -type f \
            -print \
            | sort


      # ========================================================
      # Upload
      # ========================================================

      - name: Upload Android ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-android-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error