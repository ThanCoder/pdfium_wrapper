name: Build macOS

on:
  workflow_dispatch:
  workflow_call:

env:
  PDFIUM_VERSION: "7988"

jobs:

  build:

    name: macOS ${{ matrix.arch }}

    runs-on: macos-latest

    strategy:
      fail-fast: false

      matrix:

        include:

          - arch: arm64
            pdfium: pdfium-mac-arm64.tgz

          - arch: x64
            pdfium: pdfium-mac-x64.tgz

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDFium
        run: |

          mkdir -p third_party/pdfium

          curl -L \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/${{ matrix.pdfium }}" \
            -o pdfium.tgz

          tar -xzf pdfium.tgz \
            -C third_party/pdfium

      - name: Inspect PDFium
        run: |

          find third_party/pdfium \
            -maxdepth 4 \
            -type f \
            | sort

      - name: Configure
        run: |

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DPDFIUM_DIR="$PWD/third_party/pdfium"

      - name: Build
        run: |

          cmake \
            --build build \
            --config Release \
            --parallel

      - name: Verify
        run: |

          test -f build/libpdfium_wrapper.dylib

          file \
            build/libpdfium_wrapper.dylib

      - name: Package
        run: |

          mkdir -p \
            "dist/macos-${{ matrix.arch }}"

          cp \
            build/libpdfium_wrapper.dylib \
            "dist/macos-${{ matrix.arch }}/"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-macos-${{ matrix.arch }}
          path: dist/macos-${{ matrix.arch }}/libpdfium_wrapper.dylib