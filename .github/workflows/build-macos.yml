name: Build PDFium Wrapper - macOS

on:

  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version || '7988' }}

jobs:

  macos-arm64:

    name: macOS arm64

    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Download PDFium
        env:
          PDFIUM_PACKAGE: pdfium-mac-arm64
        run: |
          chmod +x .github/scripts/download-pdfium.sh
          .github/scripts/download-pdfium.sh

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPDFIUM_ROOT="$GITHUB_WORKSPACE/.pdfium/pdfium-mac-arm64"

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      - name: Verify
        run: |
          file build/libpdfium_wrapper.dylib

          otool \
            -L \
            build/libpdfium_wrapper.dylib

      - name: Package
        run: |
          mkdir -p dist/macos-arm64

          cp build/libpdfium_wrapper.dylib \
            dist/macos-arm64/

          if [ -f ".pdfium/pdfium-mac-arm64/lib/libpdfium.dylib" ]; then
            cp \
              .pdfium/pdfium-mac-arm64/lib/libpdfium.dylib \
              dist/macos-arm64/
          fi

          cp src/ffi/ffi_wrapper.h \
            dist/macos-arm64/

          tar \
            -czf \
            pdfium-wrapper-macos-arm64.tar.gz \
            -C dist \
            macos-arm64

      - name: Upload
        uses: actions/upload-artifact@v4

        with:
          name: pdfium-wrapper-macos-arm64
          path: pdfium-wrapper-macos-arm64.tar.gz
          if-no-files-found: error