```yaml
name: Build PDFium Wrapper - Linux ARM64

on:
  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version }}

jobs:
  build-linux-arm64:
    name: Linux ARM64

    # GitHub-hosted ARM64 runner
    runs-on: ubuntu-24.04-arm

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            curl \
            tar

      # --------------------------------------------------------
      # Download PDFium ARM64
      # --------------------------------------------------------

      - name: Download PDFium
        run: |
          set -eux

          PDFIUM_URL="https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/pdfium-linux-arm64.tgz"

          echo "Downloading:"
          echo "$PDFIUM_URL"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "$PDFIUM_URL" \
            --output pdfium.tgz

      # --------------------------------------------------------
      # Extract PDFium
      # --------------------------------------------------------

      - name: Extract PDFium
        run: |
          set -eux

          tar \
            -xzf pdfium.tgz

          rm -f pdfium.tgz

          echo "PDFium files:"
          find pdfium-linux-arm64 -maxdepth 2 -type f | sort

      # --------------------------------------------------------
      # Verify PDFium
      # --------------------------------------------------------

      - name: Verify PDFium
        run: |
          set -eux

          test -f \
            "pdfium-linux-arm64/lib/libpdfium.so"

          file \
            "pdfium-linux-arm64/lib/libpdfium.so"

          nm -D \
            "pdfium-linux-arm64/lib/libpdfium.so" \
            | grep "FPDF_InitLibrary"

      # --------------------------------------------------------
      # Configure
      # --------------------------------------------------------

      - name: Configure CMake
        run: |
          set -eux

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPDFIUM_ROOT="$PWD/pdfium-linux-arm64"

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------

      - name: Build
        run: |
          set -eux

          cmake \
            --build build \
            --parallel

      # --------------------------------------------------------
      # Verify wrapper
      # --------------------------------------------------------

      - name: Verify wrapper
        run: |
          set -eux

          test -f \
            "build/libpdfium_wrapper.so"

          file \
            "build/libpdfium_wrapper.so"

          nm -D \
            "build/libpdfium_wrapper.so" \
            | grep " pdfium_init$"

          readelf -d \
            "build/libpdfium_wrapper.so" \
            | grep -E 'RPATH|RUNPATH'

      # --------------------------------------------------------
      # Package
      # --------------------------------------------------------

      - name: Prepare package
        run: |
          set -eux

          mkdir -p dist/lib

          # Wrapper
          cp \
            build/libpdfium_wrapper.so \
            dist/lib/

          # PDFium + dependencies
          cp \
            pdfium-linux-arm64/lib/*.so \
            dist/lib/

          echo "Package contents:"
          find dist -type f -maxdepth 3 | sort

      # --------------------------------------------------------
      # Verify architecture
      # --------------------------------------------------------

      - name: Verify package
        run: |
          set -eux

          file dist/lib/*.so

          echo
          echo "Wrapper dependencies:"
          ldd dist/lib/libpdfium_wrapper.so

          echo
          echo "Exported wrapper symbols:"
          nm -D dist/lib/libpdfium_wrapper.so \
            | grep -E ' pdfium_init$'

      # --------------------------------------------------------
      # Upload artifact
      # --------------------------------------------------------

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-linux-arm64
          path: dist/
          if-no-files-found: error
```
