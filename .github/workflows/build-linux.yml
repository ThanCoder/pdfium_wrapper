name: Build PDFium Wrapper - Linux

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version || '7988' }}

jobs:

  linux:
    name: Linux ${{ matrix.arch }}

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        include:

          - arch: x64
            package: pdfium-linux-x64
            compiler: native

          - arch: arm64
            package: pdfium-linux-arm64
            compiler: cross

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang \
            curl \
            tar \
            file

      # ======================================================
      # ARM64 compiler
      # ======================================================

      - name: Install ARM64 compiler
        if: matrix.compiler == 'cross'
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      # ======================================================
      # Download PDFium
      # ======================================================

      - name: Download PDFium
        env:
          PDFIUM_PACKAGE: ${{ matrix.package }}
        run: |
          chmod +x .github/scripts/download-pdfium.sh

          .github/scripts/download-pdfium.sh

      # ======================================================
      # Verify
      # ======================================================

      - name: Verify PDFium
        run: |
          echo "PDFIUM_ROOT=$PDFIUM_ROOT"
          echo "PDFIUM_INCLUDE=$PDFIUM_INCLUDE"
          echo "PDFIUM_LIB=$PDFIUM_LIB"
          echo "PDFIUM_LIBRARY=$PDFIUM_LIBRARY"

          test -d "$PDFIUM_INCLUDE"
          test -d "$PDFIUM_LIB"
          test -f "$PDFIUM_LIBRARY"

          file "$PDFIUM_LIBRARY"

      # ======================================================
      # Configure x64
      # ======================================================

      - name: Configure x64
        if: matrix.arch == 'x64'
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPDFIUM_ROOT="$PDFIUM_ROOT"

      # ======================================================
      # Configure ARM64
      # ======================================================

      - name: Configure arm64
        if: matrix.arch == 'arm64'
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DPDFIUM_ROOT="$PDFIUM_ROOT"

      # ======================================================
      # Build
      # ======================================================

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      # ======================================================
      # Verify wrapper
      # ======================================================

      - name: Verify wrapper
        run: |
          test -f build/libpdfium_wrapper.so

          file \
            build/libpdfium_wrapper.so

      # ======================================================
      # Package
      # ======================================================

      - name: Package
        run: |
          mkdir -p "dist/linux-${{ matrix.arch }}"

          cp \
            build/libpdfium_wrapper.so \
            "dist/linux-${{ matrix.arch }}/"

          # PDFium may contain additional .so dependencies.
          cp \
            "$PDFIUM_LIB"/*.so \
            "dist/linux-${{ matrix.arch }}/"

          cp \
            src/ffi/ffi_wrapper.h \
            "dist/linux-${{ matrix.arch }}/"

          tar \
            -czf \
            "pdfium-wrapper-linux-${{ matrix.arch }}.tar.gz" \
            -C dist \
            "linux-${{ matrix.arch }}"

      # ======================================================
      # Artifact
      # ======================================================

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-linux-${{ matrix.arch }}
          path: pdfium-wrapper-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error