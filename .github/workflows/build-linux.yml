name: Build PDFium Wrapper - Linux x86_64

on:
  workflow_dispatch:
    inputs:
      pdfium_version:
        description: PDFium Chromium version
        required: false
        default: "7988"

env:
  PDFIUM_VERSION: ${{ inputs.pdfium_version }}

jobs:
  build-linux-arm64:
    name: Linux x86_64

    runs-on: ubuntu-24.04
    

    steps:
      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # Dependencies
      # ========================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            curl \
            tar

      # ========================================================
      # Download PDFium
      # ========================================================

      - name: Download PDFium
        run: |
          set -eux

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/pdfium-linux-arm64.tgz" \
            -o pdfium.tgz

      # ========================================================
      # Extract PDFium
      #
      # Result:
      #
      # pdfium/
      # └── lib/
      #     ├── libpdfium.so
      #     └── *.so
      #
      # ========================================================

      - name: Extract PDFium
        run: |
          set -eux

          mkdir -p pdfium

          tar \
            -xzf pdfium.tgz \
            -C pdfium

          rm -f pdfium.tgz

          echo "PDFium files:"
          find pdfium -maxdepth 2 -type f -print

      # ========================================================
      # Verify PDFium
      # ========================================================

      - name: Verify PDFium
        run: |
          set -eux

          test -f \
            "pdfium/lib/libpdfium.so"

          file \
            "pdfium/lib/libpdfium.so"

          nm -D \
            "pdfium/lib/libpdfium.so" \
            | grep "FPDF_InitLibrary"

      # ========================================================
      # Configure CMake
      # ========================================================

      - name: Configure CMake
        run: |
          set -eux

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPDFIUM_ROOT="$PWD/pdfium"

      # ========================================================
      # Build
      # ========================================================

      - name: Build
        run: |
          set -eux

          cmake \
            --build build \
            --parallel

      # ========================================================
      # Verify Wrapper
      # ========================================================

      - name: Verify Wrapper
        run: |
          set -eux

          test -f \
            "build/libpdfium_wrapper.so"

          file \
            "build/libpdfium_wrapper.so"

          echo
          echo "Exported symbols:"
          nm -D \
            "build/libpdfium_wrapper.so" \
            | grep " pdfium_init$"

          echo
          echo "RPATH / RUNPATH:"
          readelf -d \
            "build/libpdfium_wrapper.so" \
            | grep -E 'RPATH|RUNPATH'

      # ========================================================
      # Prepare artifact
      #
      # Final:
      #
      # dist/
      # └── lib/
      #     └── libpdfium_wrapper.so
      #
      # PDFium libraries are intentionally NOT uploaded.
      #
      # ========================================================

      - name: Prepare artifact
        run: |
          set -eux

          mkdir -p dist/lib

          cp \
            build/libpdfium_wrapper.so \
            dist/lib/

          # PDFium libraries are intentionally NOT uploaded.
          #
          # cp \
          #   pdfium/lib/*.so \
          #   dist/lib/

          echo "Artifact:"
          find dist -type f -print | sort

      # ========================================================
      # Verify artifact
      # ========================================================

      - name: Verify artifact
        run: |
          set -eux

          echo "Libraries:"
          file dist/lib/*.so

          echo
          echo "Wrapper dependencies:"
          ldd dist/lib/libpdfium_wrapper.so

          echo
          echo "Wrapper symbols:"
          nm -D \
            dist/lib/libpdfium_wrapper.so \
            | grep " pdfium_init$"

      # ========================================================
      # Upload
      # ========================================================

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-linux-arm64
          path: dist/
          if-no-files-found: error

