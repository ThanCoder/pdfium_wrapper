name: Build Linux

on:
  workflow_dispatch:
  workflow_call:

env:
  PDFIUM_VERSION: "7988"

jobs:

  build:

    name: Linux x64
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++

      - name: Download PDFium
        run: |

          mkdir -p third_party/pdfium

          curl -L \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_VERSION}/pdfium-linux-x64.tgz" \
            -o pdfium.tgz

          tar -xzf pdfium.tgz \
            -C third_party/pdfium

      - name: Inspect PDFium
        run: |
          find third_party/pdfium \
            -maxdepth 4 \
            -type f \
            | sort

      - name: Configure
        run: |

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPDFIUM_DIR="$PWD/third_party/pdfium"

      - name: Build
        run: |

          cmake \
            --build build \
            --parallel

      - name: Verify
        run: |

          test -f build/libpdfium_wrapper.so

          file \
            build/libpdfium_wrapper.so

      - name: Package
        run: |

          mkdir -p dist/linux-x64

          cp \
            build/libpdfium_wrapper.so \
            dist/linux-x64/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-wrapper-linux-x64
          path: dist/linux-x64/libpdfium_wrapper.so